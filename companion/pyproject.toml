[project]
name = "dufleet"
version = "0.1.0"
description = "mydu-fleet companion: runs beside each game client, bridges the in-game bus and the hub"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "supabase>=2.20",
]

[project.scripts]
dufleet = "dufleet.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dufleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"src/dufleet/pins.py" = ["E501"]  # one pinned file per line
